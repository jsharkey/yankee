
esphome:
  # Hostnames can't contain "_" (mDNS breaks), so the node name uses dashes.
  # friendly_name keeps the old name, so Home Assistant's device and entity
  # names stay exactly as they were.
  name: midea-${ zone | replace('_', '-') }
  friendly_name: midea_$zone

esp8266:
  board: esp01_1m
  framework:
    version: recommended

packages:
  common: !include ../common.yaml

logger:
  baud_rate: 0

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600

climate:
  - platform: midea
    id: midea_$zone
    name: "Midea $zone_friendly (UART)"
    period: 1s
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: true
