
esphome:
  name: well

esp8266:
  board: esp01_1m
  restore_from_flash: true
  framework:
    version: recommended

packages:
  common: !include common.yaml

api:
  reboot_timeout: 3h

logger:
  baud_rate: 0

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
    id: button
    on_press:
     - switch.toggle: relay1

switch:
  - platform: gpio
    name: "Well Power"
    pin: GPIO15
    id: relay1
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:water-well"

output:
  - platform: gpio
    id: blue_led
    pin: GPIO02
    inverted: true

interval:
  - interval: 1s
    then:
     if:
       condition:
         wifi.connected:
       then:
         - output.turn_on: blue_led
       else:  #blinks if wi-fi isn't connected
         - output.turn_on: blue_led
         - delay: 500ms
         - output.turn_off: blue_led
