
esphome:
  name: cyd_$zone

esp32:
  board: esp32dev
  framework:
    version: recommended

api:
ota:
  platform: esphome

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0
  logs:
    component: ERROR

font:
  - file:
      type: gfonts
      family: Roboto+Condensed
      weight: 400
    id: font_small
    size: 18
    bpp: 4
    glyphs: "!\"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"
    extras:
      - file:
          type: gfonts
          family: Material+Symbols+Outlined
          weight: 400
        glyphs: [
          "\U0000ec0f", # solar_power
          "\U0000f13b", # battery_full
          "\U0000f8b0", # battery_75
          "\U0000f8af", # battery_50
          "\U0000f155", # battery_25
          "\U0000e846", # thermometer
          "\U0000e002", # warning
          "\U0000e646", # power_off
          "\U0000f16f", # mode_off_on
          ]
  - file:
      type: local
      path: "~/.fonts/Helvetica/Helvetica LT Condensed Medium.ttf"
    id: font_big
    size: 56
    bpp: 4
    glyphs: "!\"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"
    extras:
      - file:
          type: gfonts
          family: Material+Symbols+Outlined
          weight: 400
        glyphs: [
          "\U0000f16f", # mode_off_on
          ]
  - file:
      type: gfonts
      family: Material+Symbols+Outlined
      weight: 400
    id: icon_big
    size: 64
    bpp: 4
    glyphs: [
      "\U0000e316", # keyboard_arrow_up
      "\U0000e313", # keyboard_arrow_down
      "\U0000e9ba", # logout
      ]

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      then:
        - script.execute: backlight_idle
  - platform: rgb
    name: RGB
    id: led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: homeassistant
    id: zone_left_mode
    entity_id: ${zone_left}
    internal: true
  - platform: homeassistant
    id: zone_right_mode
    entity_id: ${zone_right}
    internal: true

sensor:
  - platform: homeassistant
    id: zone_left_temp_current
    entity_id: ${zone_left}
    attribute: current_temperature
    internal: true
    on_value:
      - component.update: cyd
  - platform: homeassistant
    id: zone_left_temp_target
    entity_id: ${zone_left}
    attribute: temperature
    internal: true
    on_value:
      - component.update: cyd
  - platform: homeassistant
    id: zone_right_temp_current
    entity_id: ${zone_right}
    attribute: current_temperature
    internal: true
    on_value:
      - component.update: cyd
  - platform: homeassistant
    id: zone_right_temp_target
    entity_id: ${zone_right}
    attribute: temperature
    internal: true
    on_value:
      - component.update: cyd
  - platform: homeassistant
    id: pv_power
    entity_id: sensor.18kpv_pv_power
    internal: true
    on_value:
      - component.update: cyd
  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.18kpv_battery_soc
    internal: true
    on_value:
      - component.update: cyd

binary_sensor:
  - platform: homeassistant
    id: house_awake
    entity_id: input_boolean.house_awake
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: page_update
  - platform: homeassistant
    id: electrical_grid_online
    entity_id: input_boolean.electrical_grid_online
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: page_update

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    pin: GPIO4
    id: led_red
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_green
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_blue
    inverted: true

display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    id: cyd
    color_palette: 8BIT
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays:
    - cyd
  pages:
    - id: page_asleep
      bg_color: black
      widgets:
        - button:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            shadow_opa: TRANSP
            widgets:
              - label:
                  id: text_asleep
                  text: "House in Away Mode\nTouch to Wake"
                  text_font: font_small
                  text_color: grey
                  text_align: CENTER
            on_click:
              - homeassistant.action:
                  action: input_boolean.turn_on
                  data:
                    entity_id: input_boolean.house_awake
    - id: page_awake
      bg_color: black
      widgets:
        - container:
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1)]
              grid_rows: [FR(6), FR(9), FR(9)]
              multiple_widgets_per_cell: true
            widgets:
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_column_span: ${zone_left_span}
                  grid_cell_row_pos: 0
                  grid_cell_x_align: CENTER
                  grid_cell_y_align: END
                  hidden: ${zone_left_hidden}
                  text: ${zone_left_title}
                  text_font: font_small
                  text_color: white
                  text_align: CENTER
              - obj:
                  grid_cell_column_pos: 0
                  grid_cell_column_span: ${zone_left_span}
                  grid_cell_row_pos: 1
                  grid_cell_row_span: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_left_hidden}
                  bg_opa: TRANSP
                  pad_all: 0
                  border_width: 0
                  outline_width: 0
                  shadow_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_track: center
                    flex_align_cross: center
                    pad_row: 0
                    pad_column: 0
                  widgets:
                    - label:
                        pad_top: -10
                        pad_bottom: -5
                        text: "\U0000f16f"
                        text_font: font_big
                        text_color: white
                        text_align: CENTER
                    - label:
                        text: "\U0000e846 72°"
                        text_font: font_small
                        text_color: grey
                        text_align: CENTER
              - button:
                  id: zone_left_warmer
                  grid_cell_column_pos: 0
                  grid_cell_column_span: ${zone_left_span}
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_left_hidden}
                  bg_opa: TRANSP
                  shadow_opa: TRANSP
                  widgets:
                    - label:
                        align: CENTER
                        pad_bottom: 30
                        text: "\U0000e316"
                        text_font: icon_big
                        text_color: 0xFF0000
                  on_click:
                    - homeassistant.service:
                        service: climate.set_temperature
                        data:
                          entity_id: ${zone_left}
                          temperature: !lambda "return id(zone_left_temp_target).state + 1;"
              - button:
                  id: zone_left_cooler
                  grid_cell_column_pos: 0
                  grid_cell_column_span: ${zone_left_span}
                  grid_cell_row_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_left_hidden}
                  bg_opa: TRANSP
                  shadow_opa: TRANSP
                  widgets:
                    - label:
                        align: CENTER
                        pad_top: 30
                        text: "\U0000e313"
                        text_font: icon_big
                        text_color: 0x0000FF
                  on_click:
                    - homeassistant.service:
                        service: climate.set_temperature
                        data:
                          entity_id: ${zone_left}
                          temperature: !lambda "return id(zone_left_temp_target).state - 1;"
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 0
                  grid_cell_x_align: CENTER
                  grid_cell_y_align: END
                  hidden: ${zone_right_hidden}
                  text: ${zone_right_title}
                  text_font: font_small
                  text_color: white
                  text_align: CENTER
              - obj:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 1
                  grid_cell_row_span: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_right_hidden}
                  bg_opa: TRANSP
                  pad_all: 0
                  border_width: 0
                  outline_width: 0
                  shadow_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_track: center
                    flex_align_cross: center
                    pad_row: 0
                    pad_column: 0
                  widgets:
                    - label:
                        pad_top: -10
                        pad_bottom: -5
                        text: "72°"
                        text_font: font_big
                        text_color: white
                        text_align: CENTER
                    - label:
                        text: "\U0000e846 72°"
                        text_font: font_small
                        text_color: grey
                        text_align: CENTER
              - button:
                  id: zone_right_warmer
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_right_hidden}
                  bg_opa: TRANSP
                  shadow_opa: TRANSP
                  widgets:
                    - label:
                        align: CENTER
                        pad_bottom: 30
                        text: "\U0000e316"
                        text_font: icon_big
                        text_color: 0xFF0000
              - button:
                  id: zone_right_cooler
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  hidden: ${zone_right_hidden}
                  bg_opa: TRANSP
                  shadow_opa: TRANSP
                  widgets:
                    - label:
                        align: CENTER
                        pad_top: 30
                        text: "\U0000e313"
                        text_font: icon_big
                        text_color: 0x0000FF
              - obj:
                  grid_cell_column_pos: 2
                  grid_cell_row_pos: 0
                  grid_cell_row_span: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: TRANSP
                  pad_all: 0
                  border_width: 0
                  outline_width: 0
                  shadow_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_track: center
                    flex_align_cross: center
                    pad_row: 0
                    pad_column: 0
                  widgets:
                    - label:
                        text: "\U0000ec0f 10kW"
                        text_font: font_small
                        text_color: green
                        text_align: CENTER
                    - label:
                        text: "\U0000f8b0 50%"
                        text_font: font_small
                        text_color: yellow
                        text_align: CENTER
                    - label:
                        text: "\U0000e646 No Grid"
                        text_font: font_small
                        text_color: red
                        text_align: CENTER
                    - button:
                        hidden: ${zone_leave_hidden}
                        bg_opa: TRANSP
                        shadow_opa: TRANSP
                        pad_top: 20
                        pad_bottom: -5
                        text: "\U0000e9ba"
                        text_font: icon_big
                        text_color: white
                        text_align: CENTER
                        on_click:
                          - homeassistant.action:
                              action: input_boolean.turn_off
                              data:
                                entity_id: input_boolean.house_awake
                    - label:
                        hidden: ${zone_leave_hidden}
                        text: "Leave"
                        text_font: font_small
                        text_color: white
                        text_align: CENTER

interval:
  - interval: 5s
    then:
      - lvgl.widget.update:
          id: text_asleep
          x: !lambda "return rand() % 160;"
          y: !lambda "return rand() % 200;"

script:
  - id: page_update
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: house_awake
          then:
            - lvgl.page.show: page_awake
          else:
            - lvgl.page.show: page_asleep
  - id: backlight_on
    mode: single
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
  - id: backlight_idle
    mode: restart
    then:
      - delay: 5s
      - light.turn_on:
          id: backlight
          brightness: 100% #50%

touchscreen:
  platform: xpt2046
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860
  on_touch:
    then:
      - script.execute: backlight_on
  on_release:
    then:
      - script.execute: backlight_idle
