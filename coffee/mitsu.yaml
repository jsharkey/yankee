
# RED = GND
# WHI = 5V
# YEL = TX
# ORG = RX

esphome:
  name: mitsu_$zone

esp8266:
  board: esp01_1m
  framework:
    version: recommended

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: 1
  rx_pin: 3

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

climate:
  - platform: cn105
    id: mitsu_$zone
    name: "Mitsubishi $zone_friendly"
    update_interval: 2s
    remote_temperature_source:
      sensor_id: remote_temp
    remote_temperature_timeout: 120min
    remote_temperature_keepalive_interval: 20s
    compressor_frequency_sensor:
      name: Compressor Frequency
      entity_category: diagnostic
    outside_air_temperature_sensor:
      name: Outside Air Temp
      entity_category: diagnostic
    vertical_vane_select:
      name: Vertical Vane
      entity_category: diagnostic
    horizontal_vane_select:
      name: Horizontal Vane
      entity_category: diagnostic
    isee_sensor:
      name: ISEE Sensor
      entity_category: diagnostic
    stage_sensor:
      name: Stage
      entity_category: diagnostic
    sub_mode_sensor:
      name: Sub Mode
      entity_category: diagnostic
    auto_sub_mode_sensor:
      name: Auto Sub Mode
      entity_category: diagnostic
    input_power_sensor:
      name: Input Power
      entity_category: diagnostic
    kwh_sensor:
      name: Energy Usage
      entity_category: diagnostic
    runtime_hours_sensor:
      name: Runtime Hours
      entity_category: diagnostic
    air_purifier_switch:
      name: Air purifier
      entity_category: diagnostic
    night_mode_switch:
      name: Night mode
      entity_category: diagnostic
    circulator_switch:
      name: Circulator
      entity_category: diagnostic
    airflow_control_select:
      name: Airflow Control
      entity_category: diagnostic
    on_state:
      - lambda: |-
          auto current_f = (x.current_temperature * (9.0/5.0)) + 32.0;
          auto target_f = (x.target_temperature * (9.0/5.0)) + 32.0;
          auto delta_f = current_f - target_f;
          ESP_LOGD("mitsu", "current=%f target=%f delta=%f", current_f, target_f, delta_f);
          if (x.mode == CLIMATE_MODE_FAN_ONLY && delta_f <= -1) {
            ESP_LOGD("mitsu", "heating too cold; moving from fan to heat");
            id(script_heat).execute();
          } else if (x.mode == CLIMATE_MODE_HEAT && delta_f >= 1) {
            ESP_LOGD("mitsu", "heating too hot; moving from heat to fan");
            id(script_fan).execute();
          } else if (x.mode == CLIMATE_MODE_COOL) {
            ClimateFanMode desired;
            if (${zone_force_cooling_fan_medium}) {
              desired = CLIMATE_FAN_MEDIUM;
            } else if (delta_f >= 1) {
              desired = CLIMATE_FAN_AUTO;
            } else {
              desired = CLIMATE_FAN_QUIET;
            }

            // Only send a command when the fan mode actually needs to change;
            // on_state fires every poll, so without this guard we'd spam the unit.
            if (!x.fan_mode.has_value() || *x.fan_mode != desired) {
              ESP_LOGD("mitsu", "cooling; changing fan mode to %s",
                       LOG_STR_ARG(climate_fan_mode_to_string(desired)));
              auto call = id(mitsu_$zone).make_call();
              call.set_fan_mode(desired);
              call.perform();
            }
          }

script:
  - id: script_heat
    mode: single
    then:
      - climate.control:
          id: mitsu_$zone
          mode: "OFF"
      - delay: 5s
      - climate.control:
          id: mitsu_$zone
          mode: "HEAT"
      - delay: 5s
      - climate.control:
          id: mitsu_$zone
          fan_mode: "AUTO"
  - id: script_fan
    mode: single
    then:
      - climate.control:
          id: mitsu_$zone
          mode: "OFF"
      - delay: 5s
      - climate.control:
          id: mitsu_$zone
          mode: "FAN_ONLY"
      - delay: 5s
      - climate.control:
          id: mitsu_$zone
          fan_mode: "AUTO"

sensor:
  - platform: uptime
    name: Uptime
  - platform: homeassistant
    id: remote_temp
    name: "Remote Temperature Sensor"
    entity_id: ${remote_temp_sensor}
    internal: false
    disabled_by_default: true
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    filters:
      - lambda: return (x - 32) * (5.0/9.0);
      - filter_out: nan
