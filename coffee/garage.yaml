
substitutions:
  friendly_name: Garage

esphome:
  name: garage

esp8266:
  board: esp12e
  framework:
    version: recommended

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  min_auth_mode: WPA2
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    pin: GPIO16 # RY1
    id: relay_door_large
  - platform: gpio
    pin: GPIO14 # RY2
    id: relay_door_small

script:
  - id: script_door_large
    mode: queued
    then:
      - switch.turn_on: relay_door_large
      - delay: 0.5s
      - switch.turn_off: relay_door_large
  - id: script_door_small
    mode: queued
    then:
      - switch.turn_on: relay_door_small
      - delay: 0.5s
      - switch.turn_off: relay_door_small

button:
  - platform: template
    name: Large Garage Toggle
    icon: mdi:garage
    on_press:
      - script.execute: script_door_large
  - platform: template
    name: Small Garage Toggle
    icon: mdi:garage
    on_press:
      - script.execute: script_door_small

binary_sensor:
  - platform: gpio
    device_class: garage_door
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 0.5s
    name: Large Garage Open
    icon: mdi:garage-open
  - platform: gpio
    device_class: garage_door
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 0.5s
    name: Small Garage Open
    icon: mdi:garage-open
