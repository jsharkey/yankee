
substitutions:
  zone: n_bed
  zone_friendly: "North Bedroom"
  remote_temp_sensor: sensor.tze200_a8sdabtg_ts0601_1_temperature

esphome:
  name: mitsu_$zone

esp8266:
  board: esp01_1m
  framework:
    version: recommended

api:
  reboot_timeout: 3h

ota:
  platform: esphome

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: 1
  rx_pin: 3

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

climate:
  - platform: thermostat
    id: mitsu
    name: "Mitsubishi $zone_friendly"
    sensor: temp_from_ha
    cool_deadband: 0.25°C
    cool_overrun: 0.25°C
    heat_deadband: 0.25°C
    heat_overrun: 0.25°C
    min_cooling_off_time: 3min
    min_cooling_run_time: 3min
    min_heating_off_time: 3min
    min_heating_run_time: 3min
    min_idle_time: 1min
    set_point_minimum_differential: 1°C
    heat_cool_mode: []
    cool_action:
      - lambda: |-
          auto call = id(mitsu_internal).make_call();
          call.set_mode(climate::CLIMATE_MODE_COOL);
          call.set_target_temperature(id(mitsu).target_temperature_high);
          call.perform();
    heat_action:
      - lambda: |-
          auto call = id(mitsu_internal).make_call();
          call.set_mode(climate::CLIMATE_MODE_HEAT);
          call.set_target_temperature(id(mitsu).target_temperature_low);
          call.perform();
    idle_action:
      - delay: 0s
    on_state:
      - lambda: |-
          if (id(mitsu).mode == CLIMATE_MODE_OFF) {
            auto call = id(mitsu_internal).make_call();
            call.set_mode(climate::CLIMATE_MODE_OFF);
            call.perform();
          }
    default_preset: home
    preset:
      - name: home
        mode: heat_cool
        default_target_temperature_low: 68°F
        default_target_temperature_high: 74°F
      - name: away
        mode: heat
        default_target_temperature_low: 50°F
        default_target_temperature_high: 86°F
    visual:
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1
  - platform: cn105
    id: mitsu_internal
    name: "Mitsubishi $zone_friendly (Internal)"
    update_interval: 2s
    remote_temperature_timeout: 30min
    remote_temperature_keepalive_interval: 15s
    remote_temperature_source:
      sensor_id: temp_from_ha
    on_state:
      - lambda: |-
          auto current_f = (x.current_temperature * (9.0/5.0)) + 32.0;
          auto target_f = (x.target_temperature * (9.0/5.0)) + 32.0;
          auto delta_f = current_f - target_f;
          ESP_LOGD("mitsu", "current=%f target=%f delta=%f", current_f, target_f, delta_f);
          if (x.mode == CLIMATE_MODE_HEAT && delta_f <= -1) {
            x.fan_mode = CLIMATE_FAN_AUTO;
          } else if (x.mode == CLIMATE_MODE_COOL && delta_f >= 1) {
            x.fan_mode = CLIMATE_FAN_AUTO;
          } else {
            x.fan_mode = CLIMATE_FAN_QUIET;
          }

sensor:
  - platform: uptime
    name: Uptime
  - platform: homeassistant
    name: "Remote Temperature Sensor"
    entity_id: ${remote_temp_sensor}
    id: temp_from_ha
    internal: false
    disabled_by_default: true
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    filters:
      - lambda: return (x - 32) * (5.0/9.0);
      - clamp:
          min_value: 1
          max_value: 40
          ignore_out_of_range: true
      - throttle: 30s
