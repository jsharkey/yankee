
esphome:
  name: theatre

esp8266:
  board: esp12e
  framework:
    version: recommended

api:
ota:
  platform: esphome

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
  dump: all
  idle: 25ms

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: "Epson Power"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x5583
          command: 0x6F90
  - platform: template
    name: "Epson Power On"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x5583
          command: 0x807F
  - platform: template
    name: "Epson Power Off"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x5583
          command: 0x6E91
