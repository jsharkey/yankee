# Stoplights: three IOTBT4E8-style segment bars ("Dazzle Bright", Zengge
# product 170), driven straight from an ESP32 over BLE instead of the
# dazzle_bright HA component. One set of controls drives all three bars
# identically.
#
# Entities: Light (on/off + brightness), Night Light and Rainbow switches,
# Signal select. Every change sends the whole bar as one E1 03 command:
#   night x8 (ff8811 when on, black when off), black x9, signal x1
# Rainbow overrides both: red, orange, yellow, green, blue, purple, 3 each.
# Off blanks all segments (a real power-off flashes white on the next power-on).
#
# Reliability: the ESP32 keeps a permanent connection to every bar (one BLE
# slot each), reconnects on its own, re-sends the state to a bar as soon as it
# reconnects, and re-sends to all bars every refresh_interval in case a
# packet was lost (writes are unacknowledged). Per-bar "Connected" and RSSI
# diagnostics show which bar is struggling.
#
# Each bar accepts only one BLE connection: remove them from the dazzle_bright /
# lednetwf_ble integrations and close the phone app.

substitutions:
  friendly_name: Stoplights
  stoplight_1_mac: "08:65:F0:29:B4:E7"
  stoplight_2_mac: "08:65:F0:29:B4:E8"
  stoplight_3_mac: "08:65:F0:29:B4:E9"
  refresh_interval: 5min    # periodic re-send to every bar
  night_segments: "8"       # top of the bar
  gap_segments: "9"         # black between night and signal
  night_color: "0xFF8811"
  signal_yellow: "0xFF4400" # what "yellow" sends
  packet_size: "20"         # BLE packet size; 20 fits the default 23-byte MTU

esphome:
  name: stoplights
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    version: recommended

logger:

packages:
  common: !include common.yaml

esp32_ble:
  max_connections: 3        # one permanent slot per bar

esp32_ble_tracker:
  scan_parameters:
    active: false           # passive scanning is enough to find the bars

# auto_connect (the default) keeps each bar connected and reconnects when the
# link drops. On (re)connect, wait for the bar to settle, then send it the
# current state; the other bars are left alone.
ble_client:
  - id: stoplight_1
    mac_address: ${stoplight_1_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 0
      - delay: 1s
      - lambda: id(bar_pending) |= 1;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[0] = 0;
      - logger.log: "stoplight 1 disconnected; reconnecting"
  - id: stoplight_2
    mac_address: ${stoplight_2_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 1
      - delay: 1s
      - lambda: id(bar_pending) |= 2;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[1] = 0;
      - logger.log: "stoplight 2 disconnected; reconnecting"
  - id: stoplight_3
    mac_address: ${stoplight_3_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 2
      - delay: 1s
      - lambda: id(bar_pending) |= 4;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[2] = 0;
      - logger.log: "stoplight 3 disconnected; reconnecting"

interval:
  - interval: ${refresh_interval}
    then:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push

globals:
  - id: bar_level        # light level 0..1 (0 = off)
    type: float
    initial_value: "0"
  - id: bar_seq          # packet sequence number
    type: uint8_t
    initial_value: "0"
  - id: bar_frames       # BLE packets of the command being sent
    type: std::vector<std::vector<uint8_t>>
  - id: bar_frame_idx
    type: size_t
    initial_value: "0"
  - id: bar_pending      # bars (bit 0..2) that still need the current state
    type: uint8_t
    initial_value: "0"
  - id: bar_targets      # bars the packets being sent go to
    type: uint8_t
    initial_value: "0"
  - id: bar_handle       # per bar: handle of the ff01 write characteristic (0 = unknown)
    type: std::array<uint16_t, 3>
    initial_value: "{0, 0, 0}"

script:
  # At connect: find the ff01 write characteristic in whichever service holds
  # it and remember its handle. Must run synchronously in on_connect, before
  # ESPHome releases the service list ("All clients established, services
  # released"). If it's missing, log what the bar offers and reconnect.
  - id: bar_find_ff01
    mode: parallel
    parameters:
      bar: int
    then:
      - lambda: |-
          ble_client::BLEClient *bars[3] = {id(stoplight_1), id(stoplight_2), id(stoplight_3)};
          auto *client = bars[bar];
          const auto FF01 = esp32_ble::ESPBTUUID::from_uint16(0xFF01);
          auto *chr = client->get_characteristic(0xFFFF, 0xFF01);
          for (uint16_t h = 1; chr == nullptr && h < 0x200; h++) {
            auto *c = client->get_characteristic(h);
            if (c != nullptr && c->uuid == FF01) chr = c;
          }
          if (chr != nullptr) {
            id(bar_handle)[bar] = chr->handle;
            char su[esp32_ble::UUID_STR_LEN];
            chr->service->uuid.to_str(su);
            ESP_LOGI("stoplights", "stoplight %d: ff01 is handle 0x%04x in service %s", bar + 1, chr->handle, su);
            return;
          }
          id(bar_handle)[bar] = 0;
          ESP_LOGE("stoplights", "stoplight %d: characteristic ff01 not found; reconnecting. Found:", bar + 1);
          for (uint16_t h = 1; h < 0x200; h++) {
            auto *c = client->get_characteristic(h);
            if (c == nullptr || c->handle != h) continue;
            char cu[esp32_ble::UUID_STR_LEN], su[esp32_ble::UUID_STR_LEN];
            c->uuid.to_str(cu);
            c->service->uuid.to_str(su);
            ESP_LOGE("stoplights", "  service %s char %s handle 0x%04x props 0x%02x", su, cu, h, c->properties);
          }
          esp_ble_gattc_cache_clean(client->get_remote_bda());
          client->disconnect();

  - id: bar_push
    mode: restart
    then:
      - lambda: |-
            // A send cut short by this restart still owes its bars the (new) state.
            const uint8_t unfinished = id(bar_frame_idx) < id(bar_frames).size() ? id(bar_targets) : 0;

            // Build the E1 03 segment command for the current state and split it into
            // BLE packets (Zengge "v0" framing, ble_version < 8), into id(bar_frames).
            const int pct = id(bar_level) <= 0.0f ? 0 : std::max(1, (int) nearbyint(id(bar_level) * 100.0));
            const uint32_t BLACK = 0x000000;
            std::vector<uint32_t> segs;
            if (pct == 0) {
              // light off: blank every segment (a real power-off makes it flash white on power-on)
              segs.assign(${night_segments} + ${gap_segments} + 1, BLACK);
            } else if (id(bar_rainbow).state) {
              const uint32_t rainbow[6] = {0xFF0000, 0xFF6400, 0xFFFF00, 0x00FF00, 0x0000FF, 0xA000FF};
              const int n = ${night_segments} + ${gap_segments} + 1;
              for (int i = 0; i < n; i++) segs.push_back(rainbow[i * 6 / n]);
            } else {
              const uint32_t night = id(bar_night).state ? ${night_color} : BLACK;
              uint32_t signal = BLACK;
              const std::string opt = id(bar_signal).current_option().str();
              if (opt == "red") signal = 0xFF0000;
              else if (opt == "yellow") signal = ${signal_yellow};
              else if (opt == "green") signal = 0x00FF00;
              else if (opt == "blue") signal = 0x0000FF;
              else if (opt == "purple") signal = 0xA000FF;
              segs.assign(${night_segments}, night);
              segs.insert(segs.end(), ${gap_segments}, BLACK);
              segs.push_back(signal);
            }

            // E1 03 <preview> 00 <gradient> 00 <n>, then n x [A1 hs_hi hs_lo v]
            // hs = (hue << 7) | sat; brightness scales each RGB channel first.
            std::vector<uint8_t> p = {0xE1, 0x03, 0x00, 0x00, 0x00, 0x00, (uint8_t) segs.size()};
            // (nearbyint = round-half-even, matching dazzle_multicolor.py)
            const double k = (pct == 0 ? 100 : pct) / 100.0;
            for (uint32_t rgb : segs) {
              const double r = nearbyint(((rgb >> 16) & 0xFF) * k) / 255.0;
              const double g = nearbyint(((rgb >> 8) & 0xFF) * k) / 255.0;
              const double b = nearbyint((rgb & 0xFF) * k) / 255.0;
              const double mx = std::max(r, std::max(g, b)), mn = std::min(r, std::min(g, b)), d = mx - mn;
              double h = 0;
              if (d > 0) {
                if (mx == r) h = fmod((g - b) / d, 6.0);
                else if (mx == g) h = (b - r) / d + 2.0;
                else h = (r - g) / d + 4.0;
                h *= 60.0;
                if (h < 0) h += 360.0;
              }
              const int hue = ((int) nearbyint(h)) % 360;
              const int sat = mx > 0 ? (int) nearbyint(d / mx * 100.0) : 0;
              const int val = (int) nearbyint(mx * 100.0);
              const uint16_t hs = ((hue & 0x1FF) << 7) | (sat & 0x7F);
              p.insert(p.end(), {0xA1, (uint8_t) (hs >> 8), (uint8_t) (hs & 0xFF), (uint8_t) val});
            }

            // Framing: single packet "00 seq 80 00 len_hi len_lo len+1 cmd", or
            // first "40 seq 00 00 len_hi len_lo max-7 cmd" + "40 seq idx_hi idx_lo n" (last idx | 0x8000).
            const uint8_t cmd = 0x0B;
            const int max_len = ${packet_size};
            const int L = p.size();
            const uint8_t seq = ++id(bar_seq);
            auto &frames = id(bar_frames);
            frames.clear();
            if (L <= max_len - 8) {
              std::vector<uint8_t> f = {0x00, seq, 0x80, 0x00, (uint8_t) (L >> 8), (uint8_t) L, (uint8_t) (L + 1), cmd};
              f.insert(f.end(), p.begin(), p.end());
              frames.push_back(f);
            } else {
              const int first = max_len - 8;
              std::vector<uint8_t> f = {0x40, seq, 0x00, 0x00, (uint8_t) (L >> 8), (uint8_t) L, (uint8_t) (max_len - 7), cmd};
              f.insert(f.end(), p.begin(), p.begin() + first);
              frames.push_back(f);
              int pos = first, idx = 1;
              while (pos < L) {
                const int n = std::min(L - pos, max_len - 5);
                const uint16_t seg = (pos + n >= L) ? (idx | 0x8000) : idx;
                std::vector<uint8_t> c = {0x40, seq, (uint8_t) (seg >> 8), (uint8_t) seg, (uint8_t) n};
                c.insert(c.end(), p.begin() + pos, p.begin() + pos + n);
                frames.push_back(c);
                pos += n;
                idx++;
              }
            }
            id(bar_frame_idx) = 0;
            // A control change goes to every bar; a reconnect/refresh only to the
            // bars that asked. Bars that aren't connected get it when they reconnect.
            id(bar_targets) = id(bar_pending) | unfinished;
            id(bar_pending) = 0;
      # write the packets 30 ms apart, like the phone app / dazzle_multicolor.py
      - while:
          condition:
            lambda: return id(bar_frame_idx) < id(bar_frames).size();
          then:
            - lambda: |-
                ble_client::BLEClient *bars[3] = {id(stoplight_1), id(stoplight_2), id(stoplight_3)};
                const size_t i = id(bar_frame_idx)++;
                auto &f = id(bar_frames)[i];
                if (i == 0) {
                  char hex[format_hex_pretty_size(255)];
                  ESP_LOGD("stoplights", "send to bars mask %u, %u packets, first %s", id(bar_targets),
                           (unsigned) id(bar_frames).size(), format_hex_pretty_to(hex, f, ' '));
                }
                for (int b = 0; b < 3; b++) {
                  if (!(id(bar_targets) & (1 << b))) continue;
                  if (!bars[b]->connected()) {
                    // it is sent the current state when it reconnects
                    if (i == 0) ESP_LOGW("stoplights", "stoplight %d not connected; will update on reconnect", b + 1);
                    id(bar_targets) &= ~(1 << b);
                    continue;
                  }
                  // Handle captured by bar_find_ff01 at connect time (ESPHome frees
                  // the discovered services right after discovery).
                  const uint16_t handle = id(bar_handle)[b];
                  if (handle == 0) {
                    if (i == 0) ESP_LOGE("stoplights", "stoplight %d: no ff01 handle; see its connect log", b + 1);
                    id(bar_targets) &= ~(1 << b);
                    continue;
                  }
                  esp_ble_gattc_write_char(bars[b]->get_gattc_if(), bars[b]->get_conn_id(), handle, f.size(),
                                           f.data(), ESP_GATT_WRITE_TYPE_NO_RSP, ESP_GATT_AUTH_REQ_NONE);
                }
            - delay: 30ms

output:
  - platform: template
    id: bar_output
    type: float
    write_action:
      - globals.set:
          id: bar_level
          value: !lambda return state;
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push

light:
  - platform: monochromatic
    name: Light
    id: bar_light
    output: bar_output
    gamma_correct: 1.0             # brightness maps straight to the bar's 1-100 %
    default_transition_length: 0s  # one command per change, no fades
    restore_mode: RESTORE_DEFAULT_OFF

switch:
  - platform: template
    name: Night Light
    id: bar_night
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push
    on_turn_off:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push
  - platform: template
    name: Rainbow
    id: bar_rainbow
    icon: mdi:looks
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push
    on_turn_off:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push

select:
  - platform: template
    name: Signal
    id: bar_signal
    icon: mdi:traffic-light
    optimistic: true
    restore_value: true
    options: [black, red, yellow, green, blue, purple]
    initial_option: black
    on_value:
      - lambda: id(bar_pending) |= 7;
      - script.execute: bar_push

binary_sensor:
  - platform: template
    name: Stoplight 1 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_1).connected();
  - platform: template
    name: Stoplight 2 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_2).connected();
  - platform: template
    name: Stoplight 3 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_3).connected();

sensor:
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_1
    name: Stoplight 1 RSSI
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_2
    name: Stoplight 2 RSSI
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_3
    name: Stoplight 3 RSSI
    entity_category: diagnostic
    update_interval: 60s
