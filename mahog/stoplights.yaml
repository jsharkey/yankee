# Stoplights: four IOTBT4E8-style segment bars ("Dazzle Bright", Zengge
# product 170), driven straight from an ESP32 over BLE instead of the
# dazzle_bright HA component. One set of controls drives all the bars
# identically; each bar's segment count is set in substitutions.
#
# Entities:
#   Night Light (light, brightness): the top 8 segments in night_color. Changes
#     fade over Night Light Fade Time seconds (default 60), one step per second.
#   Signal (light, brightness + RGB colour): the bottom (last) segment.
#   Rainbow (button): red, orange, yellow, green, blue, purple in equal blocks
#     along each bar, at full brightness. Any change to Night Light or Signal
#     leaves it.
# Every change sends each bar its whole layout as one E1 03 command:
#   night x8, black gap (the rest), signal x1
#   e.g. 18 segments: 8 + 9 + 1; 20 segments: 8 + 11 + 1
# With both lights off every segment is black (the bars are never powered off:
# a real power-off flashes white on the next power-on).
#
# Reliability: the ESP32 keeps a permanent connection to every bar (one BLE
# slot each), reconnects on its own, re-sends the state to a bar as soon as it
# reconnects, and re-sends to all bars every refresh_interval in case a
# packet was lost (writes are unacknowledged). Per-bar "Connected" and RSSI
# diagnostics show which bar is struggling.
#
# Each bar accepts only one BLE connection: remove them from the dazzle_bright /
# lednetwf_ble integrations and close the phone app.

substitutions:
  friendly_name: Stoplights
  stoplight_1_mac: "08:65:F0:29:B4:E7"
  stoplight_2_mac: "08:65:F0:29:B4:E8"
  stoplight_3_mac: "08:65:F0:29:B4:E9"
  stoplight_4_mac: "08:65:F0:0E:76:AF"
  stoplight_1_segments: "18"  # total segments on each bar
  stoplight_2_segments: "18"
  stoplight_3_segments: "18"
  stoplight_4_segments: "20"
  refresh_interval: 5min    # periodic re-send to every bar
  night_segments: "8"       # top of the bar; the last segment is the signal and
                            # everything in between is black
  night_color: "0xFF8811"
  night_fade_time: "60"     # default Night Light Fade Time, seconds (1 step/s)
  packet_size: "240"        # BLE packet size: a whole command fits in one packet
                            # (bars negotiate a 512-byte MTU; use "20" for a 23-byte one)

esphome:
  name: stoplights
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    version: recommended

logger:

packages:
  common: !include common.yaml

esp32_ble:
  max_connections: 4        # one permanent slot per bar

esp32_ble_tracker:
  scan_parameters:
    active: false           # passive scanning is enough to find the bars

# auto_connect (the default) keeps each bar connected and reconnects when the
# link drops. On (re)connect, wait for the bar to settle, then send it the
# current state; the other bars are left alone.
ble_client:
  - id: stoplight_1
    mac_address: ${stoplight_1_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 0
      - delay: 1s
      - lambda: id(bar_pending) |= 1;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[0] = 0;
      - logger.log: "stoplight 1 disconnected; reconnecting"
  - id: stoplight_2
    mac_address: ${stoplight_2_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 1
      - delay: 1s
      - lambda: id(bar_pending) |= 2;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[1] = 0;
      - logger.log: "stoplight 2 disconnected; reconnecting"
  - id: stoplight_3
    mac_address: ${stoplight_3_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 2
      - delay: 1s
      - lambda: id(bar_pending) |= 4;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[2] = 0;
      - logger.log: "stoplight 3 disconnected; reconnecting"
  - id: stoplight_4
    mac_address: ${stoplight_4_mac}
    on_connect:
      # runs before ESPHome frees the discovered services, so no delay first
      - script.execute:
          id: bar_find_ff01
          bar: 3
      - delay: 1s
      - lambda: id(bar_pending) |= 8;
      - script.execute: bar_push
    on_disconnect:
      - lambda: id(bar_handle)[3] = 0;
      - logger.log: "stoplight 4 disconnected; reconnecting"

interval:
  - interval: ${refresh_interval}
    then:
      - lambda: id(bar_pending) |= 15;
      - script.execute: bar_push
  # Night Light fade: each second, move 1/steps-left of the way to the target.
  - interval: 1s
    then:
      - lambda: |-
          if (id(night_steps) <= 0) return;
          id(night_now) += (id(night_target) - id(night_now)) / id(night_steps);
          if (--id(night_steps) == 0) id(night_now) = id(night_target);
          if (!id(rainbow_on)) id(bar_changed).execute();

globals:
  - id: night_target     # Night Light level 0..1 it is fading to (0 = off)
    type: float
    initial_value: "0"
  - id: night_now        # Night Light level currently shown
    type: float
    initial_value: "0"
  - id: night_steps      # fade steps left
    type: int
    initial_value: "0"
  - id: signal_rgb       # Signal colour, brightness applied, 0..1 per channel
    type: std::array<float, 3>
    initial_value: "{0, 0, 0}"
  - id: rainbow_on
    type: bool
    initial_value: "false"
  - id: bar_seq          # packet sequence number
    type: uint8_t
    initial_value: "0"
  - id: bar_frames       # per bar: BLE packets of the command being sent
    type: std::array<std::vector<std::vector<uint8_t>>, 4>
  - id: bar_frame_count  # most packets any bar's command needs
    type: size_t
    initial_value: "0"
  - id: bar_frame_idx    # next packet to send
    type: size_t
    initial_value: "0"
  - id: bar_pending      # bars (bit 0..3) that still need the current state
    type: uint8_t
    initial_value: "0"
  - id: bar_targets      # bars the packets being sent go to
    type: uint8_t
    initial_value: "0"
  - id: bar_handle       # per bar: handle of the ff01 write characteristic (0 = unknown)
    type: std::array<uint16_t, 4>
    initial_value: "{0, 0, 0, 0}"

script:
  # At connect: find the ff01 write characteristic in whichever service holds
  # it and remember its handle. Must run synchronously in on_connect, before
  # ESPHome releases the service list ("All clients established, services
  # released"). If it's missing, log what the bar offers and reconnect.
  - id: bar_find_ff01
    mode: parallel
    parameters:
      bar: int
    then:
      - lambda: |-
          ble_client::BLEClient *bars[4] = {id(stoplight_1), id(stoplight_2), id(stoplight_3), id(stoplight_4)};
          auto *client = bars[bar];
          const auto FF01 = esp32_ble::ESPBTUUID::from_uint16(0xFF01);
          auto *chr = client->get_characteristic(0xFFFF, 0xFF01);
          for (uint16_t h = 1; chr == nullptr && h < 0x200; h++) {
            auto *c = client->get_characteristic(h);
            if (c != nullptr && c->uuid == FF01) chr = c;
          }
          if (chr != nullptr) {
            id(bar_handle)[bar] = chr->handle;
            char su[esp32_ble::UUID_STR_LEN];
            chr->service->uuid.to_str(su);
            ESP_LOGI("stoplights", "stoplight %d: ff01 is handle 0x%04x in service %s", bar + 1, chr->handle, su);
            return;
          }
          id(bar_handle)[bar] = 0;
          ESP_LOGE("stoplights", "stoplight %d: characteristic ff01 not found; reconnecting. Found:", bar + 1);
          for (uint16_t h = 1; h < 0x200; h++) {
            auto *c = client->get_characteristic(h);
            if (c == nullptr || c->handle != h) continue;
            char cu[esp32_ble::UUID_STR_LEN], su[esp32_ble::UUID_STR_LEN];
            c->uuid.to_str(cu);
            c->service->uuid.to_str(su);
            ESP_LOGE("stoplights", "  service %s char %s handle 0x%04x props 0x%02x", su, cu, h, c->properties);
          }
          esp_ble_gattc_cache_clean(client->get_remote_bda());
          client->disconnect();

  - id: bar_push
    mode: restart
    then:
      - lambda: |-
            // A send cut short by this restart still owes its bars the (new) state.
            const uint8_t unfinished = id(bar_frame_idx) < id(bar_frame_count) ? id(bar_targets) : 0;

            // Build each bar's E1 03 segment command for the current state (bars can
            // have different segment counts) and split it into BLE packets (Zengge
            // "v0" framing, ble_version < 8), into id(bar_frames)[bar].
            const int bar_segs[4] = {${stoplight_1_segments}, ${stoplight_2_segments},
                                     ${stoplight_3_segments}, ${stoplight_4_segments}};
            auto scale = [](uint32_t rgb, double k) -> uint32_t {
              // (nearbyint = round-half-even, matching dazzle_multicolor.py)
              return ((uint32_t) nearbyint(((rgb >> 16) & 0xFF) * k) << 16) |
                     ((uint32_t) nearbyint(((rgb >> 8) & 0xFF) * k) << 8) | (uint32_t) nearbyint((rgb & 0xFF) * k);
            };
            const auto &c = id(signal_rgb);
            const uint32_t signal = ((uint32_t) nearbyint(c[0] * 255.0) << 16) |
                                    ((uint32_t) nearbyint(c[1] * 255.0) << 8) | (uint32_t) nearbyint(c[2] * 255.0);
            const uint32_t night = scale(${night_color}, id(night_now));
            const uint8_t seq = ++id(bar_seq);
            id(bar_frame_count) = 0;

            for (int bar = 0; bar < 4; bar++) {
              // One colour per segment, brightness already applied (0xRRGGBB):
              // night x night_segments, black gap, signal x1 (last segment).
              const int n_segs = bar_segs[bar];
              std::vector<uint32_t> segs;
              if (id(rainbow_on)) {
                const uint32_t rainbow[6] = {0xFF0000, 0xFF6400, 0xFFFF00, 0x00FF00, 0x0000FF, 0xA000FF};
                for (int i = 0; i < n_segs; i++) segs.push_back(rainbow[i * 6 / n_segs]);
              } else {
                segs.assign(std::min(${night_segments}, n_segs - 1), night);
                segs.resize(n_segs - 1, 0x000000);
                segs.push_back(signal);
              }

              // E1 03 <preview> 00 <gradient> 00 <n>, then n x [A1 hs_hi hs_lo v]
              // with hs = (hue << 7) | sat and v = 0..100.
              std::vector<uint8_t> p = {0xE1, 0x03, 0x00, 0x00, 0x00, 0x00, (uint8_t) segs.size()};
              for (uint32_t rgb : segs) {
                const double r = ((rgb >> 16) & 0xFF) / 255.0;
                const double g = ((rgb >> 8) & 0xFF) / 255.0;
                const double b = (rgb & 0xFF) / 255.0;
                const double mx = std::max(r, std::max(g, b)), mn = std::min(r, std::min(g, b)), d = mx - mn;
                double h = 0;
                if (d > 0) {
                  if (mx == r) h = fmod((g - b) / d, 6.0);
                  else if (mx == g) h = (b - r) / d + 2.0;
                  else h = (r - g) / d + 4.0;
                  h *= 60.0;
                  if (h < 0) h += 360.0;
                }
                const int hue = ((int) nearbyint(h)) % 360;
                const int sat = mx > 0 ? (int) nearbyint(d / mx * 100.0) : 0;
                int val = (int) nearbyint(mx * 100.0);
                if (val == 0 && rgb != 0) val = 1;  // very dim but not off
                const uint16_t hs = ((hue & 0x1FF) << 7) | (sat & 0x7F);
                p.insert(p.end(), {0xA1, (uint8_t) (hs >> 8), (uint8_t) (hs & 0xFF), (uint8_t) val});
              }

              // Framing: single packet "00 seq 80 00 len_hi len_lo len+1 cmd", or
              // first "40 seq 00 00 len_hi len_lo max-7 cmd" + "40 seq idx_hi idx_lo n" (last idx | 0x8000).
              const uint8_t cmd = 0x0B;
              const int max_len = ${packet_size};
              const int L = p.size();
              auto &frames = id(bar_frames)[bar];
              frames.clear();
              if (L <= max_len - 8) {
                std::vector<uint8_t> f = {0x00, seq, 0x80, 0x00, (uint8_t) (L >> 8), (uint8_t) L, (uint8_t) (L + 1), cmd};
                f.insert(f.end(), p.begin(), p.end());
                frames.push_back(f);
              } else {
                const int first = max_len - 8;
                std::vector<uint8_t> f = {0x40, seq, 0x00, 0x00, (uint8_t) (L >> 8), (uint8_t) L, (uint8_t) (max_len - 7), cmd};
                f.insert(f.end(), p.begin(), p.begin() + first);
                frames.push_back(f);
                int pos = first, idx = 1;
                while (pos < L) {
                  const int n = std::min(L - pos, max_len - 5);
                  const uint16_t seg = (pos + n >= L) ? (idx | 0x8000) : idx;
                  std::vector<uint8_t> cf = {0x40, seq, (uint8_t) (seg >> 8), (uint8_t) seg, (uint8_t) n};
                  cf.insert(cf.end(), p.begin() + pos, p.begin() + pos + n);
                  frames.push_back(cf);
                  pos += n;
                  idx++;
                }
              }
              id(bar_frame_count) = std::max(id(bar_frame_count), frames.size());
            }
            id(bar_frame_idx) = 0;
            // A control change goes to every bar; a reconnect/refresh only to the
            // bars that asked. Bars that aren't connected get it when they reconnect.
            id(bar_targets) = id(bar_pending) | unfinished;
            id(bar_pending) = 0;
      # write the packets 30 ms apart, like the phone app / dazzle_multicolor.py
      - while:
          condition:
            lambda: return id(bar_frame_idx) < id(bar_frame_count);
          then:
            - lambda: |-
                ble_client::BLEClient *bars[4] = {id(stoplight_1), id(stoplight_2), id(stoplight_3), id(stoplight_4)};
                const size_t i = id(bar_frame_idx)++;
                if (i == 0) {
                  char hex[format_hex_pretty_size(255)];
                  ESP_LOGD("stoplights", "send to bars mask %u, %u packets, bar 1 first %s", id(bar_targets),
                           (unsigned) id(bar_frame_count), format_hex_pretty_to(hex, id(bar_frames)[0][0], ' '));
                }
                for (int b = 0; b < 4; b++) {
                  if (!(id(bar_targets) & (1 << b))) continue;
                  if (i >= id(bar_frames)[b].size()) continue;  // this bar's command is done
                  auto &f = id(bar_frames)[b][i];
                  if (!bars[b]->connected()) {
                    // it is sent the current state when it reconnects
                    if (i == 0) ESP_LOGW("stoplights", "stoplight %d not connected; will update on reconnect", b + 1);
                    id(bar_targets) &= ~(1 << b);
                    continue;
                  }
                  // Handle captured by bar_find_ff01 at connect time (ESPHome frees
                  // the discovered services right after discovery).
                  const uint16_t handle = id(bar_handle)[b];
                  if (handle == 0) {
                    if (i == 0) ESP_LOGE("stoplights", "stoplight %d: no ff01 handle; see its connect log", b + 1);
                    id(bar_targets) &= ~(1 << b);
                    continue;
                  }
                  esp_ble_gattc_write_char(bars[b]->get_gattc_if(), bars[b]->get_conn_id(), handle, f.size(),
                                           f.data(), ESP_GATT_WRITE_TYPE_NO_RSP, ESP_GATT_AUTH_REQ_NONE);
                }
            - delay: 30ms

  # Control changes: wait a moment so the three RGB channel writes of one
  # Signal change (and anything else in the same instant) go out as one command.
  - id: bar_changed
    mode: restart
    then:
      - delay: 20ms
      - lambda: id(bar_pending) |= 15;
      - script.execute: bar_push

output:
  - platform: template
    id: night_output
    type: float
    write_action:
      - lambda: |-
          id(night_target) = state;
          id(night_steps) = (int) id(night_fade_time).state;
          if (id(night_steps) <= 0) {
            id(night_now) = state;  // fade time 0: change at once
            id(night_steps) = 0;
            id(rainbow_on) = false;
            id(bar_changed).execute();
          } else if (id(rainbow_on)) {
            id(rainbow_on) = false;
            id(bar_changed).execute();  // leave rainbow now; the fade follows
          }
  - platform: template
    id: signal_red
    type: float
    write_action:
      - lambda: |-
          id(signal_rgb)[0] = state;
          id(rainbow_on) = false;
          id(bar_changed).execute();
  - platform: template
    id: signal_green
    type: float
    write_action:
      - lambda: |-
          id(signal_rgb)[1] = state;
          id(rainbow_on) = false;
          id(bar_changed).execute();
  - platform: template
    id: signal_blue
    type: float
    write_action:
      - lambda: |-
          id(signal_rgb)[2] = state;
          id(rainbow_on) = false;
          id(bar_changed).execute();

# gamma_correct 1.0: HA brightness and colour map straight to the bars' values.
# No ESPHome transitions: the Night Light fade is done above, in 1 s steps.
light:
  - platform: monochromatic
    name: Night Light
    id: night_light
    icon: mdi:weather-night
    output: night_output
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: rgb
    name: Signal
    id: signal_light
    icon: mdi:traffic-light
    red: signal_red
    green: signal_green
    blue: signal_blue
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: Night Light Fade Time
    id: night_fade_time
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${night_fade_time}

button:
  - platform: template
    name: Rainbow
    icon: mdi:looks
    on_press:
      - lambda: id(rainbow_on) = true;
      - script.execute: bar_changed

binary_sensor:
  - platform: template
    name: Stoplight 1 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_1).connected();
  - platform: template
    name: Stoplight 2 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_2).connected();
  - platform: template
    name: Stoplight 3 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_3).connected();
  - platform: template
    name: Stoplight 4 Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(stoplight_4).connected();

sensor:
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_1
    name: Stoplight 1 RSSI
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_2
    name: Stoplight 2 RSSI
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_3
    name: Stoplight 3 RSSI
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: stoplight_4
    name: Stoplight 4 RSSI
    entity_category: diagnostic
    update_interval: 60s
