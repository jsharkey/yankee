# Mitsubishi MXZ-4C36NA heat pump - estimated heating COP and output
# Fitted to the MXZ-4C36NA3 spec sheet heating points (non-ducted), with the
# minimum-capacity points (~1.2 kW) inferred from the ACIQ-27Z NEEP data.
#   T = outdoor dry bulb (°F), clamped to 5..47 (the range covered by the data)
#   P = system input power (kW)
#
#   COP   = 2.766 + 0.05073*T - 0.2680*P - 0.005380*T*P        (±0.09 COP vs spec sheet)
#   Btu/h = P * (9941.4 + 147.07*T - 1075.3*P - 10.424*T*P)    (±5% vs spec sheet)
#
# Below ~1.2 kW the compressor cycles on/off; readings there are estimates.
# Below 0.1 kW the unit is treated as off: COP reports unknown, Btu/h reports 0.
# Power in W or kW, and temperature in °F or °C, are converted automatically.

# Heating mode (binary_sensor.mitsubishi_heating_mode):
#   on when climate.mitsu_n_bed_mitsubishi_north_bedroom is in "heat" mode.
#   COP and BTU sensors are unavailable while it is off, so the BTU totals
#   and daily meter only accumulate during heating.

template:
  - binary_sensor:
      - name: "mitsubishi_heating_mode"
        unique_id: mitsubishi_heating_mode
        icon: mdi:sun-snowflake-variant
        availability: >
          {{ has_value('climate.mitsu_n_bed_mitsubishi_north_bedroom') }}
        state: >
          {{ is_state('climate.mitsu_n_bed_mitsubishi_north_bedroom', 'heat') }}

  - sensor:
      - name: "mitsubishi_cop"
        unique_id: mitsubishi_cop
        icon: mdi:heat-pump
        state_class: measurement
        availability: >
          {{ has_value('sensor.emporia_monitor_mitsubishi_power')
             and has_value('sensor.temp_outdoor')
             and is_state('binary_sensor.mitsubishi_heating_mode', 'on') }}
        state: >
          {% set pw = 'sensor.emporia_monitor_mitsubishi_power' %}
          {% set p = states(pw) | float %}
          {% if state_attr(pw, 'unit_of_measurement') == 'W' %}{% set p = p / 1000 %}{% endif %}
          {% set t = states('sensor.temp_outdoor') | float %}
          {% if state_attr('sensor.temp_outdoor', 'unit_of_measurement') in ['°C', 'C'] %}
            {% set t = t * 9 / 5 + 32 %}
          {% endif %}
          {% set t = [5, [t, 47] | min] | max %}
          {% if p < 0.1 %}
            {{ none }}
          {% else %}
            {{ (2.766 + 0.05073 * t - 0.2680 * p - 0.005380 * t * p) | round(2) }}
          {% endif %}

      - name: "mitsubishi_btus"
        unique_id: mitsubishi_btus
        icon: mdi:fire
        unit_of_measurement: "BTU/h"
        state_class: measurement
        availability: >
          {{ has_value('sensor.emporia_monitor_mitsubishi_power')
             and has_value('sensor.temp_outdoor')
             and is_state('binary_sensor.mitsubishi_heating_mode', 'on') }}
        state: >
          {% set pw = 'sensor.emporia_monitor_mitsubishi_power' %}
          {% set p = states(pw) | float %}
          {% if state_attr(pw, 'unit_of_measurement') == 'W' %}{% set p = p / 1000 %}{% endif %}
          {% set t = states('sensor.temp_outdoor') | float %}
          {% if state_attr('sensor.temp_outdoor', 'unit_of_measurement') in ['°C', 'C'] %}
            {% set t = t * 9 / 5 + 32 %}
          {% endif %}
          {% set t = [5, [t, 47] | min] | max %}
          {% if p < 0.1 %}
            0
          {% else %}
            {{ (p * (9941.4 + 147.07 * t - 1075.3 * p - 10.424 * t * p)) | round(0) | int }}
          {% endif %}

# Integral of BTU/h over time -> lifetime BTU total.
sensor:
  - platform: integration
    source: sensor.mitsubishi_btus
    name: mitsubishi_btus_total
    unique_id: mitsubishi_btus_total
    unit_time: h
    method: left
    round: 0
    max_sub_interval:
      minutes: 5

# Daily total, reset at local midnight.
utility_meter:
  mitsubishi_btus_today:
    unique_id: mitsubishi_btus_today
    name: mitsubishi_btus_today
    source: sensor.mitsubishi_btus_total
    cycle: daily
